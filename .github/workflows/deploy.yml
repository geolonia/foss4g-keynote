name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages ソース = "GitHub Actions"。gh-pages ブランチへ push しなくなったので
# contents は read で足りる。pages: write / id-token: write は必要なジョブ側で
# 個別に付ける（依存を実行する build ジョブに OIDC を持たせないため）。
permissions:
  contents: read

# 公開中のデプロイは中断しない（中断すると CDN が中途半端な状態で固まりうる）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Pages 設定の読み取り（build_type の確認）だけなので read で足りる。
    permissions:
      contents: read
      pages: read
    outputs:
      # 公開後のスモークチェックで「ライブが最新バンドルか」を突き合わせるための
      # エントリ JS のファイル名（内容ハッシュ付き）。ページごとに 1 つずつ。
      # / と /ja/ は main チャンクを共有し、/post/ は独立エントリ。
      bundle: ${{ steps.bundle.outputs.name }}
      bundle_ja: ${{ steps.bundle.outputs.name_ja }}
      bundle_post: ${{ steps.bundle.outputs.name_post }}
    steps:
      - uses: actions/checkout@v7
      # Pages の公開ソースが "GitHub Actions" かを先に確かめる。
      # actions/configure-pages の enablement は「Pages サイトが未作成のときに
      # build_type=workflow で作る」だけで、既存サイト（旧 gh-pages 運用のように
      # build_type=legacy で作成済み）のソースは切り替えない。設定がズレたまま
      # 走ると deploy-pages が分かりにくいエラーで落ちるので、ここで理由付きで倒す。
      - name: Assert Pages source is "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo "none")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages の公開ソースが \"GitHub Actions\" ではありません（build_type=${build_type}）。Settings → Pages の Source を \"GitHub Actions\" に切り替えてください（gh api -X PUT repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow）。"
            exit 1
          fi
          echo "Pages source: GitHub Actions (build_type=workflow)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vite ビルド。BASE_URL は Pages のサブパス、API キーはリポジトリ
      # シークレットを VITE_* 環境変数として注入する（バンドルへ埋め込み）。
      - run: |
          : "${VITE_GEONICDB_CONTRIBUTION_KEY:?GEONICDB_CONTRIBUTION_KEY secret is required}"
          npm run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
          VITE_GEONICDB_CONTRIBUTION_KEY: ${{ secrets.GEONICDB_CONTRIBUTION_KEY }}
          VITE_GEOLONIA_API_KEY: ${{ secrets.VITE_GEOLONIA_API_KEY }}
      - id: bundle
        run: |
          set -euo pipefail
          # 各ページの HTML が読み込むエントリ JS を取り出す。マルチエントリ構成
          # （vite.config.ts の input: main/ja/post）のため、旧 livedeck の
          # index-<hash>.js ではなく main-<hash>.js（/ と /ja/ が共有）と
          # post-<hash>.js（/post/）が正（PR#4/#3 で変更）。
          # 取れなければ後段のスモークチェックが無意味になるので fail-loud。
          extract() { # $1=HTML パス $2=チャンク名プレフィックス
            local found
            found=$(grep -oE "assets/$2-[A-Za-z0-9_-]+\.js" "$1" | head -n 1 || true)
            [ -n "$found" ] || { echo "エントリ JS ($2-*.js) を $1 から特定できません" >&2; exit 1; }
            echo "$found"
          }
          name=$(extract dist/index.html main)
          name_ja=$(extract dist/ja/index.html main)
          name_post=$(extract dist/post/index.html post)
          {
            echo "name=$name"
            echo "name_ja=$name_ja"
            echo "name_post=$name_post"
          } >> "$GITHUB_OUTPUT"
          echo "expected bundles: /=$name /ja/=$name_ja /post/=$name_post"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages は OIDC でデプロイするため id-token: write が要る。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 公開後のスモークチェック用スクリプトだけ取得する。
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: deployment
        uses: actions/deploy-pages@v5
      # 公開が CDN へ反映され、かつ今ビルドしたバンドルが配信されているかを検証する。
      # 「push は成功／公開は古いまま」のズレ（issue #42）をここで赤にする。
      # 全公開ページ（/・/ja/・/post/）をそれぞれ検証する（単一ページの成功で
      # 他ページの未反映を見逃さないため）。
      - name: Verify live site serves the freshly built bundle (/)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ needs.build.outputs.bundle }}
        run: .github/scripts/verify-pages-deploy.sh
      - name: Verify live site serves the freshly built bundle (/ja/)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SUBPATH: ja/
          EXPECTED: ${{ needs.build.outputs.bundle_ja }}
        run: .github/scripts/verify-pages-deploy.sh
      - name: Verify live site serves the freshly built bundle (/post/)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SUBPATH: post/
          EXPECTED: ${{ needs.build.outputs.bundle_post }}
        run: .github/scripts/verify-pages-deploy.sh
