<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title data-en="Venue Contribution — FOSS4G Hiroshima 2026" data-ja="会場投稿 — FOSS4G Hiroshima 2026">Venue Contribution — FOSS4G Hiroshima 2026</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
  <style>
    /* post ページ専用の最小レイアウト。デッキのスライド演出(横向き固定・
       rotate-hint 等)は継承しない — スマホ縦持ちでそのまま使える独立ページ。 */
    body.post-page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 48px;
    }
    .post-card { width: 100%; max-width: 480px; }
    .post-head { text-align: center; margin-bottom: 20px; }
    /* 言語トグルは post-head と別行(right-align)に置く。post-head 内へ
       絶対配置すると、中央寄せの kicker テキストと幅次第で重なるため。 */
    .cb-topbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .cb-lang-toggle { font-size: 12px; padding: 6px 10px; }
    .cb-map-toggle {
      width: 100%;
      margin-top: 18px;
    }
    /* #cb-map は contributionMap.ts が hidden 属性の変化を監視して初期化する"器"。
       このページでは常に DOM に存在させ、トグルボタンで hidden を外すことで
       実際に地図が描画される(沈黙no-op教訓・器を後付けしない)。 */
    #cb-map {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      min-height: 280px;
    }
    #cb-map[hidden] { display: none; }
    /* cb-origin/specialty/hiddenSpot は<select>ではなく自由入力の<input type="text">。
       .fb-select(appearance:none+cursor:pointer+chevron背景)を流用すると
       "選択式のドロップダウン"に見え、自由入力できることが伝わらない
       (2026-08-30 殿ご指摘: 日本47都道府県限定selectに見える、の真因の一部)。
       ゆえにこのページでは.fb-selectと同等の見た目(枠線・背景・文字色)だけを
       .cb-text として複製し、選択式を示唆する装飾(appearance/cursor/chevron)は外す。 */
    .cb-text {
      border: 1px solid rgba(255,255,255,.16); border-radius: 9px;
      color: #eef2f8; font-size: 14px; font-family: inherit; padding: 10px 12px;
    }
    .cb-text:focus { outline: none; border-color: var(--cyan); }
  </style>
</head>
<body class="post-page" data-bg="dark">
  <main class="post-card">
    <div class="cb-topbar">
      <button type="button" id="cb-lang-toggle" class="geo-btn geo-btn--ghost cb-lang-toggle" aria-pressed="false">EN / 日本語</button>
    </div>
    <div class="post-head">
      <span class="kicker" data-en="Venue Contribution" data-ja="会場投稿">Venue Contribution</span>
      <h1 class="slide__title map-title" data-en="Your voice becomes data on the map" data-ja="あなたの一言が地図に載る">Your voice becomes data on the map</h1>
      <p class="map-desc" data-en="Where are you from? Tell us a local specialty — no login required." data-ja="出身地とその土地の名物を教えてください(ログイン不要・5秒で終わります)。">Where are you from? Tell us a local specialty — no login required.</p>
    </div>

    <form id="cb-form" class="fb-form" autocomplete="off" novalidate>
      <label class="fb-field">
        <span class="fb-field__label" data-en="Where are you from?" data-ja="出身地(都道府県 / 国)">Where are you from?</span>
        <input id="cb-origin" class="cb-text cb-input" type="text" list="cb-origin-list" placeholder="e.g. Kagawa, Japan / France / Taiwan" data-placeholder-en="e.g. Kagawa, Japan / France / Taiwan" data-placeholder-ja="例: 香川県 / フランス / 台湾" maxlength="100" required />
        <span id="cb-err-origin" class="cb-err" role="alert"></span>
      </label>
      <label class="fb-field">
        <span class="fb-field__label" data-en="A local specialty" data-ja="その土地の名物を一つ">A local specialty</span>
        <input id="cb-specialty" class="cb-text cb-input" type="text" placeholder="e.g. Sanuki udon / Fromage" data-placeholder-en="e.g. Sanuki udon / Fromage" data-placeholder-ja="例: 讃岐うどん / フロマージュ" maxlength="100" required />
        <span id="cb-err-specialty" class="cb-err" role="alert"></span>
      </label>
      <label class="fb-field">
        <span class="fb-field__label" data-en="(Optional) A hidden local spot" data-ja="(任意) 地元の隠れ名所">(Optional) A hidden local spot</span>
        <input id="cb-hiddenSpot" class="cb-text cb-input" type="text" placeholder="Not on the map yet / 地図に載っていない場所" maxlength="200" />
        <span id="cb-err-hiddenSpot" class="cb-err" role="alert"></span>
      </label>
      <!-- 自由入力の一助となる候補(<select>ではない・タップした瞬間に国際的だと
           伝わるよう日本と海外の地名を混在させる。網羅目的ではない)。 -->
      <datalist id="cb-origin-list">
        <option value="Hiroshima, Japan"></option>
        <option value="France"></option>
        <option value="Taiwan"></option>
        <option value="Germany"></option>
        <option value="Bavaria, Germany"></option>
        <option value="United States"></option>
        <option value="Indonesia"></option>
        <option value="India"></option>
        <option value="South Korea"></option>
        <option value="Kagawa, Japan"></option>
        <option value="Netherlands"></option>
        <option value="Australia"></option>
      </datalist>
      <button type="submit" id="cb-submit" class="geo-btn fb-submit">▶ Submit</button>
    </form>

    <p id="cb-count" class="fb-count" style="text-align:center;margin-top:16px;">0 submissions so far</p>

    <button type="button" id="cb-map-toggle" class="geo-btn geo-btn--ghost cb-map-toggle" aria-expanded="false" aria-controls="cb-map">
      🗺️ Open the live map
    </button>
    <!-- 器は最初から存在させる。中身の初期化・描画は contributionMap.ts が
         hidden の変化を見て担当する(器だけで沈黙する状態を作らない)。 -->
    <div id="cb-map" class="fb-chart" hidden></div>
  </main>

  <script src="https://cdn.geolonia.com/v1/embed?geolonia-api-key=%GEOLONIA_KEY%"></script>
  <script type="module" src="/src/demos/contributionPost.ts"></script>
</body>
</html>
